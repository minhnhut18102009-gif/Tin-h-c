<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit;cursor:pointer}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:1000px;margin:0 auto;padding:12px}
.logo{font-size:clamp(22px,5vw,38px);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#0ff,#f0f,#ff0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #f0f8);animation:gl 2.5s infinite alternate}

@keyframes up{from{opacity:0;transform:translateY(20px)}}
.b{padding:9px 16px;border-radius:12px;border:1px solid #0ff8;background:#0ff1;box-shadow:0 0 12px #0ff4;font-weight:700;transition:.2s}
.b:hover,.b.on{background:#0ff3;box-shadow:0 0 20px #0ffa}
.sub{text-align:center;opacity:.7;margin:0 12px 18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1000px;margin:0 auto;padding:0 12px}
.card{padding:22px 10px;text-align:center;border-color:var(--c);box-shadow:0 0 16px -2px var(--c);transition:.25s;cursor:pointer;animation:up .6s both}
.card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 0 32px var(--c)}
.ic{font-size:clamp(40px,8vw,64px);filter:drop-shadow(0 0 12px var(--c))}
.card h3{margin:8px 0 4px;color:var(--c);text-shadow:0 0 10px var(--c)}

footer li{padding:10px 6px;border-radius:12px;background:#ffffff0d;border:1px solid #0ff3;font-size:15px}
#game{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 10px 16px;min-height:100dvh}
#hud{font-weight:700;font-size:17px;text-shadow:0 0 8px #0ff;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;min-height:24px}
#stage{position:relative;width:min(100%,520px,calc((100dvh - 210px)*var(--ar,1)))}
canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:14px;box-shadow:0 0 0 2px #0ff6,0 0 30px #0ff4}
#ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#050818d9;backdrop-filter:blur(4px);border-radius:14px;text-align:center;animation:up .4s;z-index:5}
.ov h2{margin:0;font-size:30px;color:#ff0;text-shadow:0 0 16px #ff08}.ov p{margin:0 0 8px;padding:0 18px;font-size:14px;opacity:.85}
.dp{display:grid;grid-template:". u ." 64px "l d r" 64px/64px 64px 64px;gap:8px}
.dp button{border-radius:16px;border:1px solid #0ff8;background:#0ff2;font-size:24px;box-shadow:0 0 12px #0ff4}
.dp button:active{background:#0ff6}
@media(hover:hover) and (pointer:fine){.dp{display:none}}
.mg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:6px;border-radius:14px;background:#0a0f26;box-shadow:0 0 0 2px #f0f6,0 0 28px #f0f3;touch-action:manipulation}
.ce{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:900;font-size:clamp(14px,4.4vw,24px);background:linear-gradient(145deg,#4a5fa8,#222c5e);box-shadow:inset 2px 2px 3px #b5c4ff66,inset -3px -3px 5px #000a,0 3px 5px #0008;transition:.12s;cursor:pointer}
.ce.o{background:#0b1030;box-shadow:inset 0 0 8px #000;transform:scale(.96)}
.ce.x{background:#a00;animation:bm .4s}
@keyframes bm{50%{transform:scale(1.3);box-shadow:0 0 30px #f60}}
.n1{color:#4af}.n2{color:#4f8}.n3{color:#f66}.n4{color:#c6f}.n5{color:#fa0}.n6{color:#0ff}.n7{color:#fff}.n8{color:#999}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(max-width:600px){footer ul{grid-template-columns:repeat(2,1fr)}footer li{font-size:13px;padding:9px 4px}}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="home">
<div class="top"><div class="logo">NEON ARCADE</div><button class="b sb" onclick="tg()">🔊</button></div>
<p class="sub">Chọn một trò chơi để bắt đầu — chơi bằng chuột, bàn phím hoặc cảm ứng</p>

<footer class="glass"><h2>Lớp 12A1. Nhóm 6</h2><ul>

</div>

</div>
<script>
const $=s=>document.querySelector(s),R=Math.random;

{n:'Cờ Caro',i:'⭕',d:'5 quân liên tiếp để chiến thắng',c:'#f0f',f:caro},

function sov(s){const d=document.createElement('div');d.className='ov';d.innerHTML='<h2>'+cur.i+' '+cur.n+'</h2><p>'+HT[G.indexOf(cur)]+'</p><button class="b">▶ Bắt đầu</button>';d.lastChild.onclick=()=>{PA=0;d.remove();snd(660,.15,'triangle',.08,990)};s.appendChild(d)}

/* ===== 1. BẮN GÀ ===== */
function chicken(box,hud){
const c=cv(box,400,500),x=c.getContext('2d');
let sx=200,sy=440,tx=200,ty=440,B=[],E=[],Q=[],P=[],K=[],S=[],sc=0,lv=0,li=3,gl=1,t=0,dr=1,inv=0,ed=0,id,to,lt=0,cd=0,yo=0,wt=0,wm=0,bn=0,bc=0,sl=0,bt=0,bT=0,ss=1,sT=0,sv=1;
const NM=['Đội hình chuẩn','Chữ V','Vòng xoay','Bầy rắn bay','BOSS GÀ KHỔNG LỒ','Chữ X','Băng chuyền','Gọng kìm','Xoắn ốc','BOSS GÀ CHÚA','Hai vòng xoay','Kim cương'],BN=['','Xuyên','Nổ','Đuổi'],BC=['#0ff','#f0f','#fa0','#4f8'],TK={g:['⚡','#ff0'],d:['⬇️','#f44'],s:['🔽','#4f8'],b:['🔼','#fa0'],w:['🔄','#f0f'],h:['❤️','#f4a']};

const CS=['#fff','#fd6','#f88','#c8f'].map((c,i)=>[ckS(c,-3,i>2?2.4:1),ckS(c,7,i>2?2.4:1)]);
const SH=sp(80,80,q=>{q.shadowColor='#0ff';q.shadowBlur=14;const g=q.createLinearGradient(0,-24,0,18);g.addColorStop(0,'#fff');g.addColorStop(1,'#08a');q.fillStyle=g;q.beginPath();q.moveTo(0,-24);q.lineTo(8,-6);q.lineTo(26,14);q.lineTo(10,10);q.lineTo(0,18);q.lineTo(-10,10);q.lineTo(-26,14);q.lineTo(-8,-6);q.closePath();q.fill();q.shadowBlur=0;q.fillStyle='#f0f';q.beginPath();q.arc(0,-4,5,0,7);q.fill()});
for(let i=0;i<60;i++)S.push([R()*400,R()*500,.3+R()*1.5]);
const H=()=>hud.innerHTML=`<span>⭐ ${sc}</span><span>🚀 Wave ${lv}</span><span>🔫 Lv${gl}${gl>4?' MAX':''}</span>${bt?'<span>🎯 '+BN[bt]+'</span>':''}${ss!=1?'<span>'+(ss<1?'🔽 Nhỏ':'🔼 To')+'</span>':''}<span>${'❤️'.repeat(li)}</span>`;
const sn=(...a)=>{if(t-sl>4){sl=t;snd(...a)}};
function wave(){lv++;wt=(lv-1)%12;wm=0;dr=1;E=[];yo=lv>1?-330:0;bn=130;bc=60;const L=lv/4|0,hp=()=>1+L+(lv>2&&R()<.25?1:0),pu=(x,y,p)=>E.push({x,y,h:hp(),p});
if(wt==0)for(let j=0;j<3+Math.min(L,2);j++)for(let i=0;i<8;i++)pu(50+i*43,55+j*40,i);
if(wt==1)for(let j=0;j<3;j++)for(let i=-4;i<5;i++)pu(200+i*38,50+Math.abs(i)*20+j*42,i);
if(wt==2)for(let i=0;i<18;i++)E.push({r:i<12?95:50,a:i<12?i/12*6.283:i/6*6.283,h:hp(),p:i});
if(wt==3)for(let i=0;i<16+Math.min(lv,12);i++)E.push({a:i*.42,h:hp(),p:i});
if(wt==5)for(let i=-4;i<5;i++){pu(200+i*30,50+(i+4)*22,i);if(i)pu(200+i*30,50+(4-i)*22,i+1)}
if(wt==6)for(let j=0;j<4;j++)for(let i=0;i<9;i++)E.push({bx:i*44,y0:60+j*38,y:60+j*38,dd:(j%2?-1:1)*(1+j*.15),h:hp(),p:i});
if(wt==7)for(let j=0;j<7;j++)for(const d of[-1,1])E.push({sd:d,y0:50+j*32,y:50+j*32,h:hp(),p:j});
if(wt==8)for(let i=0;i<22;i++)E.push({a:i*.55,r:18+i*7,h:hp(),p:i});
if(wt==10)for(let i=0;i<16;i++)E.push({r:60,a:(i%8)/8*6.283,c:i<8?-1:1,h:hp(),p:i});
if(wt==11)for(let i=0;i<20;i++){const a=i/20*6.283,r=i%2?105:65;pu(200+Math.cos(a)*r*1.3,150+Math.sin(a)*r*.8,i)}

{const q=wt%5==4?E[0]:E[R()*E.length|0],pl=lv<3?'wwss':'wwssbd';q.tk=lv%2==0?'g':pl[R()*pl.length|0]}
if(lv>1)jingle([523,659,784]);H()}
wave();
const mv=e=>{e.preventDefault();const r=c.getBoundingClientRect();tx=(e.clientX-r.left)*400/r.width;ty=(e.clientY-r.top)*500/r.height-45};
c.onpointermove=c.onpointerdown=mv;

function hurt(){li--;gl=Math.max(1,gl-1);inv=110;pt(P,sx,sy,'#0ff',30);snd(120,.4,'sawtooth',.08,30);H();if(li<=0){ed=1;pt(P,sx,sy,'#f0f',50);jingle([300,220,150]);to=setTimeout(()=>ov(box,'💥 Game Over','Điểm: '+sc+' · Wave '+lv),800)}}
function kill(e){e.dead=1;const bg=e.boss;sc+=bg?500+lv*40:10*lv;pt(P,e.X,e.Y,'#fc0',bg?60:14);pt(P,e.X,e.Y,'#fff',bg?30:6);snd(bg?100:220,bg?.6:.2,'sawtooth',.05,40);

if(e.tk)K.push({x:e.X,y:e.Y,t:e.tk});if(bg)K.push({x:e.X+(e.tk?30:0),y:e.Y,t:'h'});H()}
function dm(e){if(!e.dead){e.h--;if(e.h<=0)kill(e)}}
function got(y){if(y=='g'){if(gl<5)gl++;else sc+=300;jingle([660,880,1175])}else if(y=='d'){gl=Math.max(1,gl-1);snd(180,.35,'sawtooth',.08,60)}else if(y=='h'){li=Math.min(li+1,5);jingle([660,880,1175])}else if(y=='s'||y=='b'){ss=y=='s'?.6:1.5;sT=1100;jingle([880,660,880])}else{let n;do n=1+(R()*3|0);while(n==bt);bt=n;bT=1300;jingle([523,784,1046])}H()}
function loop(ts){id=requestAnimationFrame(loop);const dt=Math.min((ts-(lt||ts))/16.67,3);lt=ts;t+=dt;
x.fillStyle='#050818';x.fillRect(0,0,400,500);x.fillStyle='#fff';
for(const s of S){s[1]=(s[1]+s[2]*dt)%500;x.globalAlpha=s[2]/2;x.fillRect(s[0],s[1],s[2]>1?2:1,s[2]>1?2:1)}x.globalAlpha=1;

if(sT>0&&(sT-=dt)<=0){ss=1;H()}if(bT>0&&(bT-=dt)<=0){bt=0;H()}
cd-=dt;if(cd<=0){cd=Math.max(6,15-gl*1.8);const a=[[0],[-7,7],[-10,0,10],[-14,-5,5,14],[-18,-9,0,9,18]][gl-1],n=a.length;a.forEach((o,i)=>{const g=n>2?(i-(n-1)/2)*.11:0,b=[sx+o*sv,sy-18*sv,Math.sin(g)*9,-Math.cos(g)*9];b.t=bt;b.w=ss>1?6:0;b.z=[];B.push(b)});sn(900,.05,'square',.012,300)}
const ds=Math.min(wm*.05,110),spd=Math.min(.6+lv*.08,2.2)*dt,wp=wm*(1+Math.min(lv,30)*.03),bs=wt%5==4;
if([0,1,5,11].includes(wt)){let ee=0;for(const e of E){e.x+=dr*spd;if(e.x<24||e.x>376)ee=1}if(ee){dr=-dr;for(const e of E){e.y+=12;e.x+=dr*spd*2}}}
else for(const e of E){const o=E[0];
if(e.boss){e.x=200+120*Math.sin(wp*.012);e.y=90+10*Math.sin(wp*.03)}
else if(wt==3){e.x=200+150*Math.sin(wp*.02+e.a);e.y=110+ds+45*Math.sin(wp*.04+e.a*1.3)+(e.p%2)*28}
else if(wt==6){e.x=((e.bx+e.dd*wp*.7)%440+440)%440-20;e.y=e.y0+ds*.5}
else if(wt==7){e.x=200+e.sd*(30+150*Math.abs(Math.sin(wp*.011)));e.y=e.y0+ds*.5}
else if(wt==8){const g=e.a+wp*.025;e.x=200+Math.cos(g)*e.r*1.15;e.y=165+ds*.6+Math.sin(g)*e.r*.55}
else if(wt==10){const g=e.a+e.c*wp*.022;e.x=200+e.c*(100+25*Math.sin(wp*.01))+Math.cos(g)*60;e.y=140+ds*.7+Math.sin(g)*42}
else{const cx=bs?o.x:200+70*Math.sin(wp*.012),cy=bs?o.y:150+ds,g=e.r<60?-1:1;e.x=cx+Math.cos(e.a+g*wp*.02)*e.r;e.y=cy+Math.sin(e.a+g*wp*.02)*e.r*.7}}
for(const e of E){e.X=e.x;e.Y=e.y+yo}
if(yo>=0&&E.length&&R()<Math.min(.008+lv*.0022,.05)*dt){const e=E[R()*E.length|0],vy=2.6+Math.min(lv*.14,3);if(!e.boss)Q.push([e.X,e.Y+12,lv>5&&R()<Math.min(.15+lv*.02,.5)?Math.max(-2.2,Math.min(2.2,(sx-e.X)/Math.max(30,(sy-e.Y)/vy))):0,vy])}
